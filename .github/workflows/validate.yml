name: Validate Bambu Bridge
on:
  push:
    branches: [dev, 'feat/**', 'fix/**']
  pull_request:
    branches: [dev]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v
      - run: python tests/mcp_smoke.py
      - run: python scripts/validate_package.py
      - run: python scripts/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: bambu-bridge-${{ matrix.os }}
          path: dist/
